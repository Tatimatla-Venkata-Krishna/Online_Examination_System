<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dfe4ef,#edf2f8);
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(117,183,238,.25);
    filter:blur(25px);
    animation:float 6s infinite alternate;
}

.c1{
    width:250px;
    height:250px;
    top:10%;
    left:10%;
}

.c2{
    width:200px;
    height:200px;
    bottom:10%;
    right:10%;
    animation-delay:2s;
}

@keyframes float{
    from{transform:translateY(0px);}
    to{transform:translateY(-30px);}
}

.register-card{
    width:500px;
    max-width:90%;
    padding:35px;
    background:rgba(255,255,255,.70);
    backdrop-filter:blur(25px);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:22px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#22386b;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#7b8798;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:15px;
}

.input-box input,
.input-box select{
    width:100%;
    padding:15px;
    border:1.5px solid #d8e2ee;
    outline:none;
    background:#ffffff;
    border-radius:15px;
    font-size:15px;
    color:#22386b;
    transition:.3s;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#75b7ee;
    box-shadow:0 0 0 4px rgba(117,183,238,.15);
}

.register-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#75b7ee,#5aa8e8);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.register-btn:hover{
    transform:translateY(-2px);
}

.extra{
    margin-top:20px;
    text-align:center;
}

.extra a{
    color:#5a7aa3;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="register-card">

    <div class="logo">🎓</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Register to access the Online Examination Portal
    </p>

    <form action="/create" method="post">

        <div class="input-box">
            <input type="text"
  				   name="name"
                   placeholder="Full Name"
                   required>
        </div>

        <div class="input-box">
            <input type="email"
            	   name = "email"
                   placeholder="Email Address"
                   required>
        </div>

        <div class="input-box">
            <input type="text"
            	   name="rollno"
                   placeholder="Student ID"
                   required>
        </div>
        <div class="input-box">
            <input type="password"
                   name ="password"
                   placeholder="Password"
                   required>
        </div>


        <button class="register-btn" type="submit">
            Create Account
        </button>

    </form>

    <div class="extra">
        <a href="/login">
            Already have an account? Login
        </a>
    </div>

</div>

</body>
</html>
