<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Online Examination Dashboard</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: linear-gradient(120deg, #f5f6f8, #d7eaff);

    color: #263347;

}

.dashboard {

    display: flex;

    max-width: 1400px;

    min-height: 90vh;

    margin: 30px auto;

    background: rgba(255,255,255,0.75);

    border-radius: 20px;

    box-shadow: 0 15px 40px #b5c8dd;

    overflow: hidden;

}

.sidebar {

    width: 105px;

    background: #f9fbff;

    padding: 25px 10px;

    text-align: center;

}

.logo {

    font-size: 32px;

    color: #5086c6;

    margin-bottom: 45px;

}

.menu {

    padding: 17px 5px;

    color: #7b8798;

    cursor: pointer;

    font-size: 13px;

}

.menu.active {

    color: #357ac5;

    background: #e5f0ff;

    border-radius: 12px;

}

.menu span {

    display: block;

    font-size: 22px;

    margin-bottom: 6px;

}

.main {

    flex: 1;

    min-width: 0;

    padding: 30px;

}

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

}

.topbar h2 {

    margin: 0;

}

.profile {

    background: white;

    padding: 12px 20px;

    border-radius: 25px;

}

.content {

    display: grid;

    grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);

    gap: 20px;

}

.card {

    background: rgba(255,255,255,0.9);

    padding: 24px;

    border-radius: 18px;

    box-shadow: 0 8px 25px #dce6f0;

}

.timer-card {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 20px;

}

.timer {

    font-size: 35px;

    font-weight: bold;

}

.small {

    font-size: 12px;

    color: #7c8795;

}

.progress {

    width: 100%;

    height: 9px;

    background: #e0e8f2;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 12px;

}

.progress-fill {

    height: 100%;

    width: 1%;

    background: #5797d0;

    transition: width 0.3s;

}

.question-card h3 {

    margin-top: 0;

}

.question-text {

    line-height: 1.6;

    margin: 20px 0;

}

.options {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

}

.option {

    border: 2px solid #e2eaf4;

    background: #f5f9ff;

    padding: 17px;

    border-radius: 13px;

    cursor: pointer;

}

.option.selected {

    background: #d9f0ff;

    border-color: #65b6dc;

}

.option input {

    margin-right: 10px;

}

.buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 28px;

}

button {

    padding: 12px 15px;

    border: none;

    border-radius: 20px;

    cursor: pointer;

    background: #edf2f8;

    color: #34435a;

    font-weight: bold;

}

button:hover {

    filter: brightness(0.96);

}

.save {

    background: #d8f6e5;

    color: #238a58;

}

.submit {

    background: #347ac2;

    color: white;

    width: 100%;

    margin-top: 25px;

}

.palette {

    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 9px;

    margin-top: 20px;

}

.number {

    padding: 12px 0;

    border-radius: 8px;

    background: #e6ebf2;

    text-align: center;

    cursor: pointer;

    font-size: 13px;

}

.number.current {

    background: #8dd4f0;

}

.number.answered {

    background: #a8e7c1;

}

.number.review {

    background: #ffe08a;

}

.legend {

    display: flex;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 20px;

    font-size: 12px;

}

.legend span {

    display: flex;

    align-items: center;

    gap: 5px;

}

.dot {

    width: 10px;

    height: 10px;

    border-radius: 3px;

    background: #e6ebf2;

}

@media(max-width: 850px) {

    .dashboard {

        margin: 10px;

    }

    .sidebar {

        width: 75px;

    }

    .main {

        padding: 15px;

    }

    .content {

        grid-template-columns: 1fr;

    }

    .options {

        grid-template-columns: 1fr;

    }

    .timer-card {

        flex-wrap: wrap;

    }

}

</style>

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">🎓</div>

        <div class="menu active">

            <span>▤</span>Tests

        </div>

        <div class="menu">

            <span>▥</span>Analytics

        </div>
    </aside>

    <main class="main">

        <div class="topbar">

            <h2>Active Exam</h2>

            <div class="profile">👤 Student</div>

        </div>

        <div class="content">

            <section>

                <div class="card timer-card">

                    <div>

                        <div class="small">TIME REMAINING</div>

                        <div class="timer" id="timer">45:00</div>

                        <div class="small">Minutes : Seconds</div>

                    </div>

                    <div style="flex:1">

                        <div class="small" id="questionCount">

                            QUESTION 1 OF 50

                        </div>

                        <div class="progress">

                            <div class="progress-fill"

                                 id="progressFill"></div>

                        </div>

                        <div class="small" id="answeredCount"

                             style="margin-top:8px">

                            0 Answered

                        </div>

                    </div>

                </div>

                <div class="card question-card">

                    <h3 id="questionTitle">

                        Multiple Choice Question 1

                    </h3>

                    <p class="question-text" id="questionText"></p>

                    <div class="options" id="options"></div>

                    <div class="buttons">

                        <button onclick="previousQuestion()">

                            ❮ Previous

                        </button>

                        <button onclick="clearAnswer()">

                            Clear Answer

                        </button>

                        <button onclick="markReview()">

                            Mark for Review

                        </button>

                        <button class="save"

                                onclick="nextQuestion()">

                            Save & Next ❯

                        </button>

                    </div>

                </div>

            </section>

            <aside class="card">

                <h3>Question Navigator</h3>

                <div class="small">

                    Select any question to navigate

                </div>

                <div class="palette" id="palette"></div>

                <div class="legend">

                    <span><i class="dot"

                        style="background:#a8e7c1"></i>Answered</span>

                    <span><i class="dot"

                        style="background:#8dd4f0"></i>Current</span>

                    <span><i class="dot"

                        style="background:#ffe08a"></i>Review</span>

                </div>

                <button class="submit" onclick="submitExam()">

                    Submit Examination

                </button>

            </aside>

        </div>

    </main>

</div>

<script>

const TOTAL = 30;

let current = 0;

let remaining = 50 * 60;

let submitted = false;

// Sample questions for the demo.

// Replace with questions loaded from your database.

const sampleQuestions = [

    {

        text: "Which keyword is used to inherit a class in Java?",

        options: ["implements", "extends", "inherit", "super"],

        correct: 1

    },

    {

        text: "Which method is the entry point of a Java application?",

        options: ["start()", "run()", "main()", "execute()"],

        correct: 2

    },

    {

        text: "Which interface is used for JDBC database connections?",

        options: ["Connection", "Scanner", "Runnable", "List"],

        correct: 0

    },

    {

        text: "Which SQL command retrieves data from a table?",

        options: ["INSERT", "UPDATE", "SELECT", "DELETE"],

        correct: 2

    },

    {

        text: "Which Java collection does not allow duplicate elements?",

        options: ["List", "Set", "ArrayList", "Queue"],

        correct: 1

    }

];

const questions = Array.from({length: TOTAL}, (_, i) => {

    const q = sampleQuestions[i % sampleQuestions.length];

    return {

        text: q.text,

        options: [...q.options],

        correct: q.correct

    };

});

const answers = Array(TOTAL).fill(null);

const reviews = Array(TOTAL).fill(false);

function loadQuestion() {

    document.getElementById("questionTitle").textContent =

        "Multiple Choice Question " + (current + 1);

    document.getElementById("questionText").textContent =

        questions[current].text;

    document.getElementById("questionCount").textContent =

        "QUESTION " + (current + 1) + " OF " + TOTAL;

    document.getElementById("progressFill").style.width =

        ((current + 1) / TOTAL * 100) + "%";

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    questions[current].options.forEach((option, index) => {

        const label = document.createElement("label");

        label.className = "option";

        if (answers[current] === index) {

            label.classList.add("selected");

        }

        const radio = document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.checked = answers[current] === index;

        radio.addEventListener("change", () => {

            selectAnswer(index);

        });

        label.appendChild(radio);

        label.appendChild(

            document.createTextNode(

                String.fromCharCode(65 + index) + ". " + option

            )

        );

        optionsDiv.appendChild(label);

    });

    updatePalette();

}

function selectAnswer(index) {

    if (submitted) return;

    answers[current] = index;

    loadQuestion();

}

function nextQuestion() {

    if (submitted) return;

    if (current < TOTAL - 1) {

        current++;

        loadQuestion();

    } else {

        alert("You reached the last question. Submit when ready.");

    }

}

function previousQuestion() {

    if (submitted) return;

    if (current > 0) {

        current--;

        loadQuestion();

    }

}

function clearAnswer() {

    if (submitted) return;

    answers[current] = null;

    loadQuestion();

}

function markReview() {

    if (submitted) return;

    reviews[current] = !reviews[current];

    loadQuestion();

}

function goToQuestion(index) {

    if (submitted) return;

    current = index;

    loadQuestion();

}

function updatePalette() {

    const palette = document.getElementById("palette");

    palette.innerHTML = "";

    let answered = 0;

    for (let i = 0; i < TOTAL; i++) {

        if (answers[i] !== null) answered++;

        const number = document.createElement("div");

        number.className = "number";

        number.textContent = i + 1;

        if (answers[i] !== null) {

            number.classList.add("answered");

        }

        if (reviews[i]) {

            number.classList.add("review");

        }

        if (i === current) {

            number.classList.add("current");

        }

        number.onclick = () => goToQuestion(i);

        palette.appendChild(number);

    }

    document.getElementById("answeredCount").textContent =

        answered + " Answered / " + TOTAL;

}

function updateTimer() {

    const minutes = Math.floor(remaining / 60);

    const seconds = remaining % 60;

    document.getElementById("timer").textContent =

        String(minutes).padStart(2, "0") + ":" +

        String(seconds).padStart(2, "0");

}

const timerInterval = setInterval(() => {

    if (submitted) return;

    if (remaining > 0) {

        remaining--;

        updateTimer();

    } else {

        submitExam(true);

    }

}, 1000);

function submitExam(auto = false) {

    if (submitted) return;

    if (!auto && !confirm("Are you sure you want to submit?")) {

        return;

    }

    submitted = true;

    clearInterval(timerInterval);

    let score = 0;

    let answered = 0;

    for (let i = 0; i < TOTAL; i++) {

        if (answers[i] !== null) {

            answered++;

            if (answers[i] === questions[i].correct) {

                score++;

            }

        }

    }

    alert(

        "Examination Submitted!\n" +

        "Total Questions: " + TOTAL + "\n" +

        "Answered: " + answered + "\n" +

        "Score: " + score + "/" + TOTAL

    );

}

loadQuestion();

updateTimer();

</script>

</body>

</html>
