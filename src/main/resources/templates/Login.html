<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Examination Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#dfe4ef,#edf2f8);
overflow:hidden;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(117,183,238,.3);
filter:blur(20px);
animation:float 6s infinite alternate;
}

.c1{
width:250px;
height:250px;
top:10%;
left:10%;
}

.c2{
width:180px;
height:180px;
bottom:10%;
right:10%;
animation-delay:2s;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(-30px);}
}

.login-card{
width:430px;
padding:40px;
background:rgba(255,255,255,.65);
backdrop-filter:blur(25px);
border-radius:30px;
box-shadow:0 20px 50px rgba(0,0,0,.08);
text-align:center;
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:25px;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}

h1{
color:#22386b;
margin-bottom:10px;
}

.subtitle{
color:#7b8798;
margin-bottom:30px;
}

.input-box{
margin-bottom:18px;
text-align:left;
}

.input-box input{
    width:100%;
    padding:16px;
    border:1.5px solid #d8e2ee;
    outline:none;
    background:#ffffff;
    border-radius:15px;
    font-size:15px;
    color:#22386b;
    transition:all .3s ease;
}

.input-box input::placeholder{
    color:#96a3b8;
}

.input-box input:hover{
    border-color:#bfd4ec;
}

.input-box input:focus{
    border:1.5px solid #75b7ee;
    box-shadow:0 0 0 4px rgba(117,183,238,.15);
}

.login-btn{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#75b7ee,#5aa8e8);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
transform:translateY(-2px);
}

.extra{
margin-top:25px;
display:flex;
justify-content:space-between;
font-size:14px;
}

.extra a{
text-decoration:none;
color:#5a7aa3;
}
</style>
</head>
<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="login-card">

<div class="logo">🎓</div>

<h1>Exam Portal</h1>

<form action="/check" method="post">

<div class="input-box">
<input type="text"
placeholder="Student ID" name="rollno"
required>
</div>

<div class="input-box">
<input type="password"
placeholder="Password" name="password"
required>
</div>

<button class="login-btn">
Login
</button>

</form>

<div class="extra">
<a href="#">Forgot Password?</a>
<a href="/register">Sign in</a>
</div>

</div>

</body>
</html>
